[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "emblase"
dynamic = ["version"]
description = "EMBeddings and LAtent Space Explorer - Dimensionality reduction service for synchrotron data"
authors = [
    { name = "BNL NSLS-II", email = "ymatviych@bnl.gov" },
]
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.28.1,<0.29",
    "torch>=2.0",
    "numpy>=1.24",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "transformers>=4.30",
    "joblib>=1.3",
    "scikit-learn>=1.3",
    "umap-learn>=0.5",
    "python-dotenv>=1.0",
    "tiled[client]>=0.1",
    "mlflow>=2.0",
    "azureml-mlflow>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "coverage>=7.0",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/emblase/_version.py"

[project.entry-points."tiled.special_client"]
LatentSpaceEmbedding = "emblase.tiled.client:LatentSpaceEmbedding"

[tool.hatch.build.targets.wheel]
packages = ["src/emblase"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
emblase = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
orion = "python scripts/submit_orion.py"
test-local = "python scripts/submit_local.py"
test = "python -m pytest"
serve = "uvicorn emblase.app:app --reload"
mlflow = "python scripts/manage_mlflow.py"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]   # pycodestyle, pyflakes, isort
ignore = ["E501"]                # line length handled by formatter

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/emblase"]
omit = ["src/emblase/worker/*.tmpl", "src/emblase/_version.py"]

[tool.coverage.report]
show_missing = true
