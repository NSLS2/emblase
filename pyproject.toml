[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emblase"
version = "0.1.0"
description = "EMBeddings and LAtent Space Explorer - Dimensionality reduction service for synchrotron data"
authors = [
    { name = "BNL NSLS-II", email = "ymatviych@bnl.gov" },
]
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.28.1,<0.29",
    "torch>=2.0",
    "numpy>=1.24",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "transformers>=4.30",
    "joblib>=1.3",
    "scikit-learn>=1.3",
    "umap-learn>=0.5",
    "python-dotenv>=1.0",
    "tiled[client]>=0.1",
    "mlflow>=2.0",
    "azureml-mlflow>=1.0",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.3.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",  # for MockTransport in tests
]

[project.entry-points."tiled.special_client"]
LatentSpaceEmbedding = "emblase.tiled.client:LatentSpaceEmbedding"

[tool.hatch.build.targets.wheel]
packages = ["src/emblase"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
emblase = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
orion = "python scripts/submit_orion.py"
test-local = "python scripts/submit_local.py"
test = "python -m pytest"
serve = "uvicorn emblase.app:app --reload"
mlflow = "python scripts/mlflow_registry.py"
