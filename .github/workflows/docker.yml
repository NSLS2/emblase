# Build and push the Emblase Shifter-compatible container image to GHCR.
#
# Triggers:
#   • Push of a version tag (v*.*.*) — builds the release image and tags it
#     with both the semver tag and :latest.
#   • Push to main — builds a :main snapshot (useful for staging tests on NERSC).
#   • Manual workflow_dispatch — allows ad-hoc builds from any branch/tag.
#
# Secrets required (set in the repo → Settings → Secrets → Actions):
#   GITHUB_TOKEN  — automatically provided by GitHub Actions; used to push to
#                   ghcr.io/nsls2/emblase.  No extra secret is needed as long
#                   as the repo's "Packages" write permission is granted to
#                   Actions (Settings → Actions → Workflow permissions →
#                   "Read and write permissions").

name: Build & push Docker image

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nsls2/emblase

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # Fetch full history so git describe / tags work correctly
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Semver tag on release (v1.2.3 → 1.2.3 + latest)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Branch name for snapshot builds (main → main)
            type=ref,event=branch
            # Short SHA always present
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers in the GHCR cache to speed up repeated builds
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
