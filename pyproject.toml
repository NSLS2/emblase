[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "emblase"
dynamic = ["version"]
description = "EMBeddings and LAtent Space Explorer - Dimensionality reduction service for synchrotron data"
authors = [
    { name = "BNL NSLS-II", email = "ymatviych@bnl.gov" },
]
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    # Minimal set — enough for the Tiled router plugin, client, and dashboard server.
    "fastapi>=0.115",
    "httpx>=0.28.1,<0.29",
    "numpy>=1.24",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "tiled[client]>=0.1",
    "pyarrow>=14.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# emblase[base] — Tiled router + client; suitable for the Tiled server container.
# (This is an alias for the base dependencies — no extra packages needed beyond
# what is already in `dependencies`. Listed explicitly for clarity in requirements.)
base = []

# emblase[compute] — everything needed to run inference on a compute node.
compute = [
    "uvicorn[standard]>=0.30",
    "torch>=2.0",
    "transformers>=4.30",
    "joblib>=1.3",
    "scikit-learn>=1.3",
    "umap-learn>=0.5",
    "mlflow>=2.0",
    "azureml-mlflow>=1.0",
    "certifi>=2024.0",
    "pandas>=2.0",
]

# emblase[dashboard] — minimal deps for running the monitoring dashboard server.
# No torch, no mlflow SDK, no heavy ML libraries — all MLflow queries go through
# the REST API directly via httpx.
dashboard = [
    "fastapi>=0.115",
    "httpx>=0.28.1,<0.29",
    "numpy>=1.24",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.30",
]

# emblase[all] — full installation (router + compute).
all = [
    "emblase[compute]",
]

dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "coverage>=7.0",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/emblase/_version.py"

[project.entry-points."tiled.special_client"]
LatentSpaceEmbedding = "emblase.tiled.client:LatentSpaceEmbedding"

[tool.hatch.build.targets.wheel]
packages = ["src/emblase"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
emblase = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
compute = { features = ["compute"], solve-group = "compute" }
dashboard = { features = ["dashboard"], solve-group = "default" }

[tool.pixi.feature.compute.pypi-dependencies]
emblase = { path = ".", editable = true, extras = ["compute"] }

[tool.pixi.feature.dashboard.pypi-dependencies]
emblase = { path = ".", editable = true, extras = ["dashboard"] }

[tool.pixi.feature.dashboard.tasks]
# Run the dashboard server in the lightweight dashboard environment
dashboard = "python -m emblase.dashboard.server"

[tool.pixi.tasks]
orion = "python scripts/submit_orion.py"
test-local = "python scripts/submit_local.py"
test = "python -m pytest"
serve = "uvicorn emblase.app:app --reload"
mlflow = "python scripts/manage_mlflow.py"
# Dashboard tasks
# dashboard-build: compile the React UI (requires npm in PATH)
dashboard-build = "bash -c 'cd ui/dashboard && npm install && npm run build && rm -rf ../../src/emblase/dashboard/static && cp -r dist ../../src/emblase/dashboard/static'"
# dashboard: auto-build UI if stale, then start the monitoring dashboard server
dashboard = "python -m emblase.dashboard.server"
# viewer-build: compile the embedding scatter Tiled plugin UI (requires npm in PATH)
# Output: ui/viewer/dist/viewer.js → src/emblase/tiled/static/main.js
viewer-build = "bash -c 'cd ui/viewer && npm install && npm run build && cp dist/viewer.js ../../src/emblase/tiled/static/main.js'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]   # pycodestyle, pyflakes, isort
ignore = ["E501"]                # line length handled by formatter

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/emblase"]
omit = ["src/emblase/worker/*.tmpl", "src/emblase/_version.py"]

[tool.coverage.report]
show_missing = true
